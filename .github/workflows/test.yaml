name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      # The cocotb suite wires uio_in and uio_out as separate nets, so it can
      # only observe the uio output-enable timing. This step models the pads
      # themselves and fails on any host/chip drive overlap (see
      # docs/post-silicon-readiness-audit.md, finding F1).
      - name: Check the uio pad hand-off
        run: |
          iverilog -g2012 -o /tmp/tb_pad_contention -DTPV_GDELAY=1 -I src \
            src/tt_um_echoworld424_tpv.v src/tpv_cells.v src/tpv_delay_line.v \
            src/tpv_rca16.v src/tpv_checker.v src/tpv_pattern_gen.v \
            src/tpv_ro_canary.v test/tb_pad_contention.v
          vvp /tmp/tb_pad_contention

      # The RO tool fixtures need no simulator and no PDK: they synthesise
      # rawfiles (analyzer acceptance logic, including the mid-rail readout
      # case) and check the wire-capacitance deck generator's units. Both
      # classes of defect reached the freeze record once because nothing ran
      # them. Summaries go to /tmp so the archived datasets stay untouched.
      - name: Check the RO analysis fixtures
        run: |
          python3 tools/ro/test_analyse_ro_count.py \
            --workdir /tmp/analyzer-fixtures --summary /tmp/analyzer_fixtures.json
          python3 tools/ro/test_add_wire_caps.py \
            --workdir /tmp/wirecap-fixtures \
            --summary /tmp/wirecap_generation_fixture.json

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
