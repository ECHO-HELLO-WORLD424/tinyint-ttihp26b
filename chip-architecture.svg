<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TinyInt target research architecture</title>
  <desc id="desc">A shared INT4 multiplier feeds selectable conventional and dynamic exact 20-bit accumulators. The dynamic accumulator contains five four-bit stages and software-selectable boundaries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg{fill:#f8fafc}.chip{fill:#fff;stroke:#334155;stroke-width:2.5}.box{stroke:#334155;stroke-width:2}.wire{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
      .title{font:700 28px system-ui,sans-serif;fill:#0f172a}.sub{font:14px system-ui,sans-serif;fill:#475569}.head{font:700 16px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.detail{font:12px system-ui,sans-serif;fill:#334155;text-anchor:middle}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.note{font:13px system-ui,sans-serif;fill:#334155}.small{font:11px system-ui,sans-serif;fill:#64748b}
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="48" y="45">TinyInt — bit-exact dynamic-accumulator experiment</text>
  <text class="sub" x="48" y="70">Target revision • one shared signed/unsigned INT4 multiplier • conventional versus staged 20-bit accumulation</text>

  <rect class="chip" x="130" y="100" width="950" height="540" rx="24" filter="url(#shadow)"/>
  <text class="small" x="154" y="128">tt_um_echo_hello_world424_tinyint — 1 x 1 Tiny Tapeout tile</text>

  <text class="mono" x="20" y="210">ui_in[7:0]</text>
  <text class="small" x="20" y="229">operands / CLEAR config</text>
  <path class="wire" d="M112 214 H175"/>
  <text class="mono" x="20" y="286">uio_in[4:0]</text>
  <text class="small" x="20" y="305">mode, command, valid</text>
  <path class="wire" d="M112 290 H175"/>

  <rect class="box" x="175" y="160" width="175" height="190" rx="14" fill="#dbeafe"/>
  <text class="head" x="262.5" y="194">Protocol + config</text>
  <text class="detail" x="262.5" y="220">command handshake</text>
  <text class="detail" x="262.5" y="242">signed / unsigned latch</text>
  <text class="detail" x="262.5" y="264">accumulator mode latch</text>
  <text class="detail" x="262.5" y="286">zero-skip control</text>
  <text class="detail" x="262.5" y="318">CLEAR payload:</text>
  <text class="detail" x="262.5" y="336">conventional / 8 / 12 / 16</text>

  <rect class="box" x="405" y="172" width="180" height="126" rx="14" fill="#fef3c7"/>
  <text class="head" x="495" y="205">Shared INT4 multiplier</text>
  <text class="detail" x="495" y="231">4 x 4 Baugh-Wooley</text>
  <text class="detail" x="495" y="253">signed or unsigned</text>
  <text class="detail" x="495" y="275">8-bit product</text>
  <path class="wire" d="M350 235 H405"/>

  <rect class="box" x="635" y="172" width="160" height="126" rx="14" fill="#ffedd5"/>
  <text class="head" x="715" y="205">Product extension</text>
  <text class="detail" x="715" y="231">sign or zero extend</text>
  <text class="detail" x="715" y="253">8 bits to 20 bits</text>
  <text class="detail" x="715" y="275">zero detection</text>
  <path class="wire" d="M585 235 H635"/>

  <rect class="box" x="845" y="182" width="165" height="106" rx="14" fill="#f3e8ff"/>
  <text class="head" x="927.5" y="216">Mode steering</text>
  <text class="detail" x="927.5" y="241">operand isolation</text>
  <text class="detail" x="927.5" y="263">one active path</text>
  <path class="wire" d="M795 235 H845"/>

  <rect class="box" x="405" y="390" width="250" height="116" rx="14" fill="#dcfce7"/>
  <text class="head" x="530" y="424">Conventional accumulator</text>
  <text class="detail" x="530" y="451">20-bit adder + register</text>
  <text class="detail" x="530" y="475">full-width baseline mode 00</text>
  <text class="detail" x="530" y="494">modulo 2^20</text>

  <rect class="box" x="705" y="360" width="305" height="176" rx="14" fill="#ecfeff"/>
  <text class="head" x="857.5" y="391">Dynamic accumulator</text>
  <text class="detail" x="857.5" y="413">five 4-bit state stages • modes 01 / 10 / 11</text>
  <rect x="728" y="438" width="48" height="48" rx="8" fill="#bae6fd" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="783" y="438" width="48" height="48" rx="8" fill="#bae6fd" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="838" y="438" width="48" height="48" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="893" y="438" width="48" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="948" y="438" width="48" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text class="detail" x="752" y="458">3:0</text><text class="detail" x="752" y="476">S0</text>
  <text class="detail" x="807" y="458">7:4</text><text class="detail" x="807" y="476">S1</text>
  <text class="detail" x="862" y="458">11:8</text><text class="detail" x="862" y="476">S2</text>
  <text class="detail" x="917" y="458">15:12</text><text class="detail" x="917" y="476">S3</text>
  <text class="detail" x="972" y="458">19:16</text><text class="detail" x="972" y="476">S4</text>
  <text class="detail" x="857.5" y="516">cold stages wake only on carry / borrow events</text>

  <path class="wire" d="M927 288 V330 H530 V390"/>
  <path class="wire" d="M927 288 V330 H858 V360"/>
  <text class="small" x="548" y="351">mode 00</text>
  <text class="small" x="873" y="351">modes 01–11</text>

  <rect class="box" x="405" y="555" width="605" height="58" rx="14" fill="#fce7f3"/>
  <text class="head" x="707.5" y="580">Selected 20-bit state • overflow/count/status • registered byte readback</text>
  <text class="detail" x="707.5" y="601">same arithmetic result in every mode</text>
  <path class="wire" d="M530 506 V555"/>
  <path class="wire" d="M858 536 V555"/>

  <text class="mono" x="1090" y="572">uo_out[7:0]</text>
  <text class="small" x="1090" y="591">response data</text>
  <path class="wire" d="M1010 584 H1080"/>

  <rect x="48" y="674" width="1104" height="56" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="note" x="70" y="698">Experimental invariant: dynamic boundaries change switching activity, never precision.</text>
  <text class="note" x="70" y="719">Power study: same die and workload for A/B modes; standalone builds for uncontaminated area, timing, and leakage.</text>
</svg>
